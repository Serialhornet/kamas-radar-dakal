name: Kamas Radar - Veille automatique

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'

permissions:
  contents: write

concurrency:
  group: kamas-radar-veille
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les fichiers du depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rechercher les astuces YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect.py

      - name: Publier les resultats
        run: |
          git config user.name "Kamas Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Actualiser les astuces Kamas Radar"
            git push
          fi
