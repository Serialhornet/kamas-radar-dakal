<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamas Radar Dakal</title><style>body{font:16px system-ui;background:#111827;color:#f4f6fb;margin:0}header,main{max-width:1000px;margin:auto;padding:25px}header{border-bottom:1px solid #334155}h1{color:#c4f69a}input,select{padding:12px;border-radius:8px;background:#263247;color:white;border:1px solid #475569}input{width:min(95%,420px)}.card{background:#1e293b;padding:18px;margin:14px 0;border:1px solid #334155;border-radius:12px}a{color:#c4f69a}small,p{color:#cbd5e1}.tag{color:#c4f69a}h3{margin-bottom:4px}</style></head><body><header><h1>🪙 Kamas Radar — Dakal</h1><p>Veille automatique gratuite : vidéos DOFUS, astuces kamas, brisage et métiers.</p></header><main><p id="update">Chargement…</p><input id="q" placeholder="Filtrer les pistes…" aria-label="Filtrer les pistes"><select id="sort"><option value="score">Priorité</option><option value="date">Plus récentes</option><option value="views">Moins de vues</option></select><div id="list"></div><small>Scores indicatifs uniquement. Les méthodes et prix doivent être vérifiés sur Dakal. Aucune donnée DoFocus n'est extraite automatiquement.</small></main><script>let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=document.getElementById('q').value.toLowerCase();let mode=document.getElementById('sort').value;let a=rows.filter(x=>(x.title+' '+x.description+' '+x.channel).toLowerCase().includes(q));a.sort((x,y)=>mode==='date'?String(y.date).localeCompare(String(x.date)):mode==='views'?(x.views??Infinity)-(y.views??Infinity):y.score-x.score);document.getElementById('list').innerHTML=a.length?a.map(x=>`<article class="card"><span class="tag">Priorité ${esc(x.score)} · ${x.views==null?'Vues inconnues':Number(x.views).toLocaleString('fr-FR')+' vues'}</span><h3>${esc(x.title)}</h3><small>${esc(x.channel)} · ${esc((x.date||'').slice(0,10))}</small><p>${esc(x.description)}</p><p>${esc(x.fiche_fr)}</p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Voir la vidéo ↗</a></article>`).join(''):'<p>Aucune piste pour le moment. Lance le workflow GitHub Actions.</p>'}document.getElementById('q').oninput=render;document.getElementById('sort').onchange=render;fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{rows=d.items||[];document.getElementById('update').textContent=rows.length+' pistes · Dernière collecte : '+(d.updated_at?new Date(d.updated_at).toLocaleString('fr-FR'):'pas encore lancée');render()}).catch(()=>document.getElementById('update').textContent='Erreur de chargement de data.json');</script></body></html>
